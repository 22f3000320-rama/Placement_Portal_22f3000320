<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Reminders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4"> <div class="container-fluid max-w-100" style="max-width: 1200px;">
        
        <div class="card shadow-sm border-0 rounded-4">
            
            <div class="card-header bg-white border-bottom p-4">
                <h3 class="mb-0 text-primary fw-bold">Deadline Reminders</h3>
            </div>
            
            <div class="card-body p-4">
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 text-center text-secondary" style="width: 80px;">Sr No.</th>
                                <th class="py-3 text-secondary">Drive ID</th>
                                <th class="py-3 text-secondary">Company</th>
                                <th class="py-3 text-secondary">Job Title</th>
                                <th class="py-3 text-secondary">Deadline</th>
                            </tr>
                        </thead>
                        
                        <tbody class="border-top-0">
                            {% for drive in drives %}
                            <tr>
                                <td class="py-3 text-center text-muted">{{ loop.index }}</td>
                                <td class="py-3 fw-bold text-dark">{{ drive.drive_id }}</td>
                                <td class="py-3">{{ drive.company_name }}</td>
                                <td class="py-3">{{ drive.title }}</td>
                                <td class="py-3 fw-bold text-dark">{{ drive.deadline }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="5" class="py-5 text-center text-muted">
                                    <i>No pending deadlines.</i>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                        
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
